<style>
:root{--a:#f5b301;--b:#ff9500;--g:linear-gradient(135deg,#ffd43b,#f5a300);--ad:#a86f00;--on:#2b1d00;--t:#101828;--m:#667085;--l:#e6e9f5;--in:#0fa97a;--out:#e8416a;--w:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;color:var(--t);background:radial-gradient(520px 300px at 100% -5%,#fff1bd,transparent),radial-gradient(480px 300px at -10% 15%,#ffe9c2,transparent),#fff;min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 4px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:22px;font-weight:800}
main{padding:8px 16px;max-width:560px;margin:auto}#v>*{animation:fi .25s ease both}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
.card{background:rgba(255,255,255,.9);border:1px solid var(--l);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(245,163,0,.1)}
.hero{background:var(--g);color:var(--on);border:0;box-shadow:0 12px 30px rgba(245,163,0,.32)}
.hero small{opacity:.85}.big{font-size:30px;font-weight:800;margin:2px 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two div{background:rgba(255,255,255,.4);border-radius:14px;padding:10px}
.two b{display:block;font-size:15px}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.two2 div{background:#f6f7fd;border-radius:14px;padding:10px}.two2 b{display:block;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--l);background:#fff;border-radius:99px;padding:9px 15px;font:inherit;font-weight:600;color:var(--m);transition:.2s}
.chip.on{background:var(--g);color:var(--on);border-color:transparent}
.row{display:flex;gap:8px;margin-bottom:10px}
input,select{width:100%;font:inherit;border:1px solid var(--l);border-radius:14px;padding:13px;background:#fff;color:var(--t)}
input:focus,select:focus{outline:2px solid #ffe08a}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--l);cursor:pointer;content-visibility:auto;contain-intrinsic-size:0 64px}
.it:last-child{border:0}.mut,.it small{color:var(--m)}.in{color:var(--in)}.out{color:var(--out)}.iv{color:var(--ad)}.it b{white-space:nowrap}
.gr{flex:1;min-width:0}.gr b{white-space:normal}.gr small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:40px;height:40px;border-radius:14px;background:#f1f3fb;display:grid;place-items:center;font-size:20px;flex:none}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid #c9cfe6;flex:none}.ck.on{background:var(--g);border-color:transparent;position:relative}.ck.on:after{content:"✓";color:var(--on);position:absolute;inset:0;display:grid;place-items:center;font-size:14px}
h3{margin:0 0 8px;font-size:15px}.ins p{margin:6px 0}
.tip{display:flex;gap:12px;background:#fff;border:1px solid var(--l);border-left:4px solid var(--a);border-radius:16px;padding:12px;margin-bottom:10px}
.tip p{margin:2px 0 0;color:var(--m);font-size:14px}.tip.g{border-left-color:var(--in)}.tip.w{border-left-color:var(--w)}.tip.b{border-left-color:var(--out)}
.bd{border-radius:99px;padding:5px 12px;font-weight:700;font-size:13px;background:#fff4cc;color:var(--ad)}.bd.g{background:#e6f7f1;color:var(--in)}.bd.w{background:#fff4de;color:#b7791f}.bd.b{background:#fde8ed;color:var(--out)}
.stk{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:6px 0 10px;background:#eef0fa}.stk i{display:block;height:100%}
.lg{display:flex;align-items:center;gap:8px;padding:4px 0}.lg i{width:10px;height:10px;border-radius:50%;flex:none}.lg b{margin-left:auto}
.empty{text-align:center;color:var(--m);padding:28px 10px}.empty i{font-size:34px;font-style:normal;display:block;margin-bottom:6px}
.sk{height:90px;border-radius:20px;margin-bottom:12px;background:linear-gradient(90deg,#f1f3fb 25%,#e6e9f5 50%,#f1f3fb 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--l);padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;font:inherit;font-size:11.5px;font-weight:600;color:var(--m);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}nav button.on{color:var(--ad)}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;border:0;border-radius:99px;background:var(--g);color:var(--on);font:inherit;font-weight:700;font-size:16px;padding:16px 22px;box-shadow:0 10px 26px rgba(245,163,0,.45);transition:transform .15s}
.fab:active{transform:scale(.95)}
.ov{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:10;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}.ov.on{opacity:1;visibility:visible}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(48px);transition:transform .32s cubic-bezier(.2,.8,.2,1)}.ov.on .sheet{transform:none}
.seg{display:grid;background:#f1f3fb;border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{border:0;border-radius:11px;padding:12px 4px;font:inherit;font-weight:700;background:none;color:var(--m)}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);color:var(--ad)}.seg .o.on{color:var(--out)}.seg .i.on{color:var(--in)}
.amt{font-size:28px;font-weight:800;text-align:center;margin-bottom:10px}
.btn{width:100%;border:0;border-radius:16px;background:var(--g);color:var(--on);font:inherit;font-weight:700;font-size:16px;padding:16px;margin-top:10px}
.btn:disabled{opacity:.6}.btn.d{background:#fff;color:var(--out);border:1px solid #f6c3cf}.btn.g{background:#f1f3fb;color:var(--t)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:#101828;color:#fff;padding:12px 18px;border-radius:14px;z-index:30;transition:.3s;max-width:90%}
.toast.on{transform:translate(-50%,0)}.toast.bad{background:var(--out)}
.lock{position:fixed;inset:0;background:#fff;z-index:20;display:none;align-items:center;justify-content:center;padding:24px}.lock.on{display:flex}
.logo{width:54px;height:54px;border-radius:18px;background:var(--g);margin:0 auto 10px}.err{color:var(--out);margin-top:12px;min-height:20px}
#gbtn{display:flex;justify-content:center;margin-top:14px;min-height:44px}
.bar{height:8px;border-radius:99px;background:#eef0fa;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;border-radius:99px;background:var(--g);transition:width .5s}.bar i.w{background:var(--w)}.bar i.x{background:var(--out)}
canvas{max-height:240px}

.btn,.chip,nav button,.fab,.it{transition:transform .15s,background .2s,color .2s,opacity .2s}
.btn:active,.chip:active,.fab:active{transform:scale(.96)}.it:active{background:#f6f7fd}
@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.04)}100%{transform:none;opacity:1}}
@keyframes grow{from{transform:scaleX(0)}}@keyframes rise{from{transform:scaleY(0)}}@keyframes dash{from{stroke-dasharray:0 327}}
@keyframes bnc{0%{transform:none}40%{transform:translateY(-5px)}100%{transform:none}}
@keyframes out{from{max-height:90px;opacity:1}to{max-height:0;opacity:0;transform:translateX(30px);padding-top:0;padding-bottom:0}}
.chip.on,.ck.on{animation:pop .25s}.it.new{animation:pop .45s cubic-bezier(.2,.8,.2,1)}.it.rm{animation:out .28s ease forwards;overflow:hidden}
nav button.on svg{animation:bnc .4s}.fab{animation:pop .5s .2s both}.lock.on .card{animation:pop .4s}
.bar i,.stk i{transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.rwp{position:relative;width:130px;height:130px;flex:none}.ring{width:130px;height:130px}.rg{animation:dash .9s cubic-bezier(.2,.8,.2,1) both}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.rc b{font-size:22px}.rc small{color:var(--m);font-size:11px}
.rw{display:flex;align-items:center;gap:16px}.rw .lg{padding:5px 0}
.rb{display:flex;align-items:center;gap:12px;margin-bottom:10px}.rb .bar{margin:4px 0 0}.r2{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.hm small{text-align:center;color:var(--m);font-size:11px}
.hc{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:11px;font-style:normal;animation:pop .4s both}
.wk{display:flex;gap:8px}.wk>div{flex:1;text-align:center}.wb{height:96px;display:flex;align-items:flex-end}.wb i{width:100%;border-radius:8px 8px 4px 4px;background:var(--g);transform-origin:bottom;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}.wk small{font-size:11px;color:var(--m)}
.still .bar i,.still .stk i,.still .rg,.still .wb i,.still .hc{animation:none}#v.still>*{animation:none}
.dh{width:18px;height:24px;flex:none;cursor:grab;touch-action:none;background:radial-gradient(circle,#b9bfd6 1.8px,transparent 2.3px) center/9px 9px}
.bi2{position:relative;padding:2px 0 8px;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.bi2.drag{z-index:3;background:#fff;border-radius:14px;box-shadow:0 10px 24px rgba(16,24,40,.18);transition:none}.nt .bi2{transition:none}
.bsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.bsum div{background:#fff8e1;border-radius:14px;padding:10px}.bsum b{display:block;font-size:14px}.bsum small{color:var(--m);font-size:11.5px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="lock" class="lock"><div class="card" style="width:100%;max-width:340px;text-align:center"><div class="logo"></div><h3 style="font-size:20px">Catatan Keuangan</h3><p class="mut">Masuk dengan akun Google yang sudah didaftarkan</p><div id="gbtn"></div><div class="err" id="pinErr"></div></div></div>
<header><h1 id="ttl">Beranda</h1><button class="chip" onclick="openMenu()">👤 Akun</button></header><main id="v"></main>
<button class="fab" onclick="openForm(V==='inv'?'inv':'out')">+ Tambah Transaksi</button>
<nav>
<button data-v="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Beranda</button>
<button data-v="ana"><svg viewBox="0 0 24 24"><path d="M5 20v-7M12 20V5M19 20v-10"/></svg>Grafik</button>
<button data-v="hist"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Riwayat</button>
<button data-v="inv"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Investasi</button></nav>
<div class="ov" id="ov" onclick="if(event.target===this)closeS()"><div class="sheet" id="sh"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),rp=n=>(n<0?'-':'')+'Rp '+Math.round(Math.abs(n)).toLocaleString('id-ID'),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
dt=s=>new Date(s+'T00:00'),fd8=s=>dt(s).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}),dd=(a,b)=>Math.round((dt(b)-dt(a))/864e5),
sum=(r,t)=>r.filter(x=>x.t===t).reduce((s,x)=>s+x.a,0),pc=(a,b)=>b?Math.round(a/b*100):0,
grp=(rows,t)=>{const m={};rows.forEach(r=>{if(r.t===t)m[r.k]=(m[r.k]||0)+r.a});return m},topN=(m,n)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);
const TT={home:'Beranda',ana:'Grafik & Analisis',hist:'Riwayat',inv:'Investasi'},PAL=['#f5b301','#ff8a00','#22c7b8','#f59e0b','#e8416a','#64748b','#10b981','#06b6d4'];
let D=[],IV=[],B=[],BC={mode:'month',start:'',end:''},BM='month',DG=null,CT=[],AL=[],KL=[],P='month',C={a:'',b:''},V='home',SES='',U=null,F={q:'',t:'',k:'',d:''},CH={},E=null,ft='out',fk='',tp='Setor',SM=false,SEL=new Set(),HN=60,SYNC=false,KT='out',AV='g',st0;
try{SES=localStorage.getItem('ses')||''}catch(e){}
try{const u=JSON.parse(localStorage.getItem('fin_ui')||'null');if(u){if(['day','week','month','x'].includes(u.P))P=u.P;C={a:u.a||'',b:u.b||''};if(u.AV==='g'||u.AV==='s')AV=u.AV}}catch(e){}
const saveUI=()=>{try{localStorage.setItem('fin_ui',JSON.stringify({P,a:C.a,b:C.b,AV}))}catch(e){}};
const savec=()=>{try{localStorage.setItem('fin_c',JSON.stringify({rows:D,inv:IV,budget:B,cats:CT,cfg:BC,me:U}))}catch(e){}};
const isV=()=>U&&U.role==='viewer',isM=()=>U&&U.role==='master',key=r=>r.t+r.id,mk=()=>ymd(new Date()).slice(0,7);

// ===== ikon kategori =====
const KW=k=>{k=k.toLowerCase();for(const[re,e]of[[/makan|food|kuliner/,'🍜'],[/transport|bensin|ojek|parkir/,'🚗'],[/belanja|shop/,'🛍️'],[/tagihan|listrik|pulsa|internet/,'🧾'],[/hibur|game|nonton/,'🎮'],[/sehat|obat|dokter/,'💊'],[/gaji/,'💼'],[/freelance|proyek/,'💻'],[/bonus|hadiah/,'🎁'],[/saham/,'📈'],[/emas/,'🪙'],[/reksa/,'📊'],[/darurat/,'🛟'],[/tabung/,'🏦'],[/deposito/,'💰']])if(re.test(k))return e;return''};
const ctl=j=>CT.filter(c=>c.j===j),ico=(k,j)=>{const c=CT.find(c=>c.n===k&&c.j===j);return(c&&c.i)||KW(k)||(j==='in'?'💰':j==='inv'?'📈':'💸')};

// ===== jaringan =====
const cerr=(m,net)=>{const e=new Error(m);e.net=net;return e};
async function call(a,d){
 if(typeof API==='undefined'||/GANTI/.test(API))throw cerr('Alamat API di config.js belum diisi dengan benar.');
 let x,r;
 try{x=await fetch(API,{method:'POST',body:JSON.stringify({session:SES,action:a,data:d||{}})})}
 catch(e){throw cerr(navigator.onLine?'Tidak bisa menghubungi server Apps Script. Biasanya akses deployment belum "Siapa saja", atau alamat API di config.js salah.':'Tidak ada koneksi internet.',navigator.onLine)}
 try{r=JSON.parse(await x.text())}
 catch(e){throw cerr('Balasan server tidak dikenali (HTTP '+x.status+'). Deployment kemungkinan belum diperbarui ke versi baru.',1)}
 if(!r.ok){const e=new Error(r.error);e.auth=r.auth;throw e}return r.data}
function showErr(e){const el=$('#pinErr');el.textContent=e.message;
 if(e.net){const l=document.createElement('a');l.href=API;l.target='_blank';l.textContent='Tes alamat API';l.style.cssText='display:block;margin-top:8px;color:var(--ad)';el.appendChild(l)}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function cu(e){const to=+e.dataset.n,t0=performance.now(),f=t=>{const p=Math.min(1,(t-t0)/700);e.textContent=rp(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function toast(m,good=true){const t=$('#toast');t.textContent=m;t.className='toast on'+(good?'':' bad');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='toast',2800)}

function apply(r){D=r.rows||[];IV=r.inv||[];B=r.budget||[];BC=r.cfg||BC;CT=r.cats||[];U=r.me}
function loadCache(){try{const c=JSON.parse(localStorage.getItem('fin_c'));if(c&&c.me){apply(c);return true}}catch(e){}return false}
async function load(quiet){
 if(!quiet)$('#v').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
 try{const r=await call('init');apply(r);try{localStorage.setItem('fin_c',JSON.stringify(r))}catch(e){}$('#lock').classList.remove('on');render(quiet,quiet)}
 catch(e){if(e.auth)showLock(e.message);else if(quiet&&U)toast(e.message,false);else $('#v').innerHTML=`<div class="card empty"><i>⚠️</i>${esc(e.message)}${e.net?`<br><a href="${esc(API)}" target="_blank" style="color:var(--ad)">Tes alamat API</a>`:''}<button class="btn" onclick="load()">Coba lagi</button></div>`}}
// tulis: perbarui tampilan lebih dulu, kirim ke server di latar, lalu sinkron
async function wr(local,act,d,msg,rm){SYNC=true;closeS();
 if(rm&&rm.length){const els=rm.map(k=>document.querySelector('[data-r="'+k+'"]')).filter(Boolean);if(els.length){els.forEach(e=>e.classList.add('rm'));await sleep(280)}}
 local();render(true,true);
 try{await call(act,d);toast(msg)}catch(e){toast(e.message,false)}
 try{await load(true)}finally{SYNC=false}}

// ===== login Google =====
function showLock(m){SES='';U=null;try{localStorage.removeItem('ses');localStorage.removeItem('fin_c')}catch(e){}$('#lock').classList.add('on');$('#pinErr').textContent=m||'';initG()}
function initG(){if(!window.google||!google.accounts)return setTimeout(initG,300);
 google.accounts.id.initialize({client_id:CLIENT_ID,callback:onG});
 google.accounts.id.renderButton($('#gbtn'),{theme:'outline',size:'large',shape:'pill',text:'signin_with',width:260})}
async function onG(r){$('#pinErr').textContent='Memeriksa akses…';
 try{const x=await call('login',{idtoken:r.credential});SES=x.session;try{localStorage.setItem('ses',SES)}catch(e){}$('#pinErr').textContent='';load()}
 catch(e){showErr(e)}}
function logout(){closeS();showLock('')}
function openMenu(){$('#sh').innerHTML=`<h3 style="font-size:18px">Akun</h3><p class="mut">${U?esc(U.email):''}<br>Peran: <b>${U?U.role:''}</b></p><p class="mut" style="font-size:13px">${U?{master:'Akses penuh dan mengatur pengguna',editor:'Boleh mengubah semua isi aplikasi',viewer:'Hanya bisa melihat data'}[U.role]:''}</p>${!isV()?'<button class="btn" onclick="openKat()">🏷️ Kelola Kategori</button>':''}${isM()?'<button class="btn g" onclick="openAkses()">👥 Kelola Akses</button>':''}<button class="btn d" onclick="logout()">Keluar</button><button class="btn g" onclick="closeS()">Tutup</button>`;$('#ov').classList.add('on')}

// ===== kelola akses =====
async function openAkses(){$('#sh').innerHTML='<div class="sk"></div>';try{AL=await call('ulist');drawAkses()}catch(e){toast(e.message,false);closeS()}}
function drawAkses(){$('#sh').innerHTML=`<h3 style="font-size:18px">Kelola Akses</h3><p class="mut">Master: ${esc(U.email)}<br><b>Editor</b>: boleh mengubah semua isi (transaksi, investasi, budget, kategori). <b>Viewer</b>: hanya melihat. Hanya Master yang mengatur akses.</p>`+
